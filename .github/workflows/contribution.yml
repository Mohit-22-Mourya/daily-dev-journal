name: Daily GitHub Contribution

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make daily contribution
        run: |
          echo "Daily contribution: $(date)" >> daily-contribution.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-contribution.txt
          git commit -m "Daily contribution" || echo "No changes to commit"
          git push
